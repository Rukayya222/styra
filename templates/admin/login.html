<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Styra</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin.css') }}">
</head>
<body style="margin:0;">
  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <div class="admin-login-logo">Sty<span>ra</span></div>
      <div class="admin-login-sub">Admin Panel</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash-msg {{ category }}" style="margin-bottom:16px;">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('admin_login') }}" class="admin-login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" name="username" placeholder="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">Sign in to admin →</button>
      </form>

      <p style="text-align:center; margin-top:20px; font-size:12px; color:#999;">
        <a href="{{ url_for('landing') }}" style="color:#999;">← Back to Styra</a>
      </p>
    </div>
  </div>
</body>
</html>
